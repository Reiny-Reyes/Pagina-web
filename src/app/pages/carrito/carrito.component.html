<div class="max-w-5xl mx-auto p-8">


<!-- SI ESTA VACIO -->

<div *ngIf="carrito.items.length===0" class="text-center py-20">
    

<h3 class="text-2xl font-semibold mb-4">
Tu carrito está vacío
</h3>

<p class="text-gray-500 mb-6">
Explora nuestros productos y añade algo al carrito
</p>

<a
routerLink="/productos"
class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">

Explorar Productos

</a>

</div>


<!-- SI HAY PRODUCTOS -->

<div *ngIf="carrito.items.length>0">

<div
*ngFor="let item of carrito.items"
class="flex items-center gap-6 bg-white shadow p-4 rounded-lg mb-4">

<img
[src]="item.imagen"
class="w-20">

<div class="flex-1">

<h3 class="font-semibold">
{{item.nombre}}
</h3>

<p class="text-gray-500">
${{item.precio}}
</p>

</div>

<button
(click)="eliminar(item)"
class="text-red-500">

Eliminar

</button>

</div>

<h3 class="text-xl font-bold mt-6">
Total: ${{carrito.total()}}
</h3>

</div>

</div>
