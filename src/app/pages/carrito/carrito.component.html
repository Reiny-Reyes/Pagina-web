<div class="carrito-container" *ngIf="carrito.length > 0; else carritoVacio">

  <!-- PRODUCTOS -->

  <div class="carrito-productos">

    <div
    class="producto-item"
    *ngFor="let producto of carrito">

      <img
      [src]="producto.imagen"
      class="producto-img">

      <div class="producto-info">

        <h3>{{producto.nombre}}</h3>

        <span class="categoria">
        {{producto.categoria}}
        </span>

        <div class="cantidad">

          <button (click)="disminuir(producto)">-</button>

          <span>{{producto.cantidad}}</span>

          <button (click)="aumentar(producto)">+</button>

        </div>

      </div>

      <div class="precio">

        ${{producto.precio * producto.cantidad}}

      </div>

      <button
      class="eliminar"
      (click)="eliminar(producto)">
      🗑
      </button>

    </div>

    <button
    class="vaciar"
    (click)="vaciarCarrito()">

    🗑 Vaciar Carrito

    </button>

  </div>


  <!-- RESUMEN -->

  <div class="resumen">

    <h2>Resumen del Pedido</h2>

    <div class="fila">
      <span>Subtotal</span>
      <span>${{subtotal()}}</span>
    </div>

    <div class="fila">
      <span>Envío</span>
      <span class="gratis">Gratis</span>
    </div>

    <div class="fila">
      <span>IVA (21%)</span>
      <span>${{iva()}}</span>
    </div>

    <hr>

    <div class="fila total">
      <span>Total</span>
      <span>${{total()}}</span>
    </div>

    <button class="pagar">
      Proceder al Pago
    </button>

  </div>

</div>


<!-- CARRITO VACIO -->

<ng-template #carritoVacio>

<div class="carrito-vacio">

  <div class="vacio-box">

    <div class="icono">
      🛒
    </div>

    <h2>Tu carrito está vacío</h2>

    <p>
    Parece que aún no has agregado productos.
    </p>

    <button
    routerLink="/productos"
    class="btn-explorar">

    Explorar productos

    </button>

  </div>

</div>

</ng-template>
